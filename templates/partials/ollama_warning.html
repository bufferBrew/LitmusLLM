{% if ollama_error %}
  <div class="rounded-lg border border-red-300 bg-red-50 p-4 text-sm text-red-800
              dark:border-red-500/40 dark:bg-red-500/10 dark:text-red-300">
    <p class="font-semibold">Ollama is not reachable</p>
    <p class="mt-1 leading-relaxed">{{ ollama_error }}</p>
    <p class="mt-2 text-xs">
      LitmusLLM tries to start it automatically when it&rsquo;s installed locally. If that
      failed, run <code class="rounded bg-red-100 px-1 dark:bg-red-500/20">ollama serve</code>
      in a terminal and reload this page.
    </p>
  </div>
{% endif %}
