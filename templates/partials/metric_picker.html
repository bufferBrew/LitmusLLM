{# Metric selection grid.
   Each card is a <label> wrapping a hidden checkbox, so the whole card is
   clickable and the native checkbox keeps keyboard + screen-reader support.
   The info button is a real <button> so the tooltip is focus-reachable. #}
<div class="space-y-5">
  {% for category, metrics in categories.items() %}
    <div>
      <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-500 dark:text-slate-400">
        {{ category }}
      </h3>
      <div class="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
        {% for m in metrics %}
          {% set idx = loop.index %}
          <label class="lit-pick block cursor-pointer">
            <input type="checkbox" name="metrics" value="{{ m.key }}" class="sr-only"
                   {% if m.key in default_metrics %}checked{% endif %}>
            <div class="lit-pick__frame h-full rounded-lg border border-slate-200 bg-white p-3
                        transition hover:border-amber-300 dark:border-slate-800 dark:bg-slate-900">
              <div class="flex items-start justify-between gap-2">
                <span class="text-sm font-medium leading-tight">{{ m.label }}</span>

                <span class="lit-tip {% if idx % 3 == 0 %}lit-tip--end{% endif %} shrink-0">
                  <button type="button" aria-label="What does {{ m.label }} measure?"
                          class="flex h-5 w-5 items-center justify-center rounded-full border
                                 border-slate-300 text-[11px] font-semibold text-slate-500
                                 hover:border-amber-400 hover:text-amber-600
                                 dark:border-slate-600 dark:text-slate-400">i</button>
                  <span class="lit-tip__body rounded-lg bg-slate-900 p-3 text-left text-xs
                               leading-relaxed text-slate-100 shadow-xl dark:bg-slate-800
                               dark:ring-1 dark:ring-slate-700">
                    {{ m.description }}
                    {% if m.notes %}<span class="mt-2 block text-amber-300">{{ m.notes }}</span>{% endif %}
                    <span class="mt-2 block text-slate-400">
                      {{ m.requirement_label }} &middot; threshold {{ m.threshold }}
                    </span>
                  </span>
                </span>
              </div>

              <p class="mt-1.5 text-[11px] leading-snug text-slate-500 dark:text-slate-400">
                {{ m.requirement_label }}
              </p>
              <div class="mt-1.5 flex flex-wrap gap-1">
                {% if not m.higher_is_better %}
                  <span class="rounded bg-sky-100 px-1.5 py-0.5 text-[10px] font-medium text-sky-700
                               dark:bg-sky-500/15 dark:text-sky-300">lower is better</span>
                {% endif %}
                {% if m.advanced %}
                  <span class="rounded bg-purple-100 px-1.5 py-0.5 text-[10px] font-medium text-purple-700
                               dark:bg-purple-500/15 dark:text-purple-300">advanced</span>
                {% endif %}
              </div>
            </div>
          </label>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>
